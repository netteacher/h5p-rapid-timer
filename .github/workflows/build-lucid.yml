name: Build LUCID (macOS AU/VST3)

on:
  push:
    paths: ['lucid-synth/**', '.github/workflows/build-lucid.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S lucid-synth -B build -DCMAKE_BUILD_TYPE=Release -DLUCID_COPY_PLUGIN=OFF

      - name: Build
        run: cmake --build build --config Release -j 3

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: AU validation
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/LucidSynth_artefacts/Release/AU/LUCID.component ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/LucidPulse_artefacts/Release/AU/LUCID Pulse.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/LucidPulseMidi_artefacts/Release/AU/LUCID Pulse MIDI.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumu Lcd1 Lcda
          auval -v aumu Lpu1 Lcda
          auval -v aumi Lpm1 Lcda

      - name: Package
        run: |
          mkdir -p pkg/AU pkg/VST3 pkg/Standalone
          cp -R build/LucidSynth_artefacts/Release/AU/LUCID.component "build/LucidPulse_artefacts/Release/AU/LUCID Pulse.component" "build/LucidPulseMidi_artefacts/Release/AU/LUCID Pulse MIDI.component" pkg/AU/
          cp -R build/LucidSynth_artefacts/Release/VST3/LUCID.vst3 "build/LucidPulse_artefacts/Release/VST3/LUCID Pulse.vst3" "build/LucidPulseMidi_artefacts/Release/VST3/LUCID Pulse MIDI.vst3" pkg/VST3/
          cp -R build/LucidSynth_artefacts/Release/Standalone/LUCID.app "build/LucidPulse_artefacts/Release/Standalone/LUCID Pulse.app" pkg/Standalone/
          cp lucid-synth/install-mac.sh pkg/
          cd pkg && zip -r ../LUCID-macOS.zip . && cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: LUCID-macOS
          path: LUCID-macOS.zip

      # Public, login-free download: a rolling pre-release "lucid-latest" always carries the newest build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp LUCID-macOS.zip "LUCID-macOS-build${{ github.run_number }}.zip"
          gh release view lucid-latest >/dev/null 2>&1 || \
            gh release create lucid-latest --prerelease --target "${{ github.sha }}" \
              --title "LUCID – aktueller macOS-Build" \
              --notes "Automatischer Build (AU für Logic Pro, VST3, Standalone). Nach dem Entpacken: xattr -dr com.apple.quarantine LUCID.component"
          gh release upload lucid-latest LUCID-macOS.zip "LUCID-macOS-build${{ github.run_number }}.zip" --clobber
          gh release edit lucid-latest --notes "Automatischer Build ${{ github.run_number }} von Commit ${{ github.sha }}. Enthält LUCID (Synth), LUCID Pulse (Drum-Machine) und LUCID Pulse MIDI (Sequencer als MIDI-Effekt) als AU für Logic Pro, VST3 und Standalone, Universal Binary. Installation: Zip entpacken, dann im Terminal:  bash ~/Downloads/LUCID-macOS/install-mac.sh"
